<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bora Mert Kalkan</title>
<meta name="description" content="Bora Mert Kalkan — game programmer. Interactive PS1-style portfolio: pick a game from the shelf, read the instruction manual. TR / EN.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,400&family=VT323&display=swap">
<style>
/* Layout: fullscreen low-res 3D room (canvas) + fixed HUD; TV, manual and quick view are overlays.
   Single committed look: a dark room at night lit by a CRT and a lamp. */
:root{
  --void:#05060c;      /* room darkness */
  --ink:#0b1022;       /* CRT phosphor black-blue */
  --glow:#4f7bff;      /* standby blue, the console era's light */
  --cyan:#8fe6ff;      /* highlighted text on the CRT */
  --amber:#ffb15c;     /* lamp, warnings, accents */
  --paper:#eceae3;     /* manual paper */
  --paper-ink:#16171d; /* manual print */
  --signal:#e2384f;    /* manual warning red */
  --dim:#7b84a8;       /* secondary text on dark */
  --f-display:"Michroma","Eurostile","Microgramma","Arial Black",sans-serif;
  --f-body:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-pixel:"VT323","Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:#dfe5ff;overflow:hidden;font-family:var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;background:linear-gradient(#05060ccc,#05060c00)}
#hud > *{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:13px;letter-spacing:.18em;color:#fff;white-space:nowrap}
.brand span{font-family:var(--f-pixel);font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid #2a3360;background:#0a0e1fcc;padding:6px 10px;font-family:var(--f-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;border-radius:2px;transition:background .15s,border-color .15s}
.chip:hover{background:#16204a;border-color:var(--glow)}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.lang{display:flex}
.lang button{border:1px solid #2a3360;background:#0a0e1fcc;padding:6px 8px;font-family:var(--f-display);font-size:10px;letter-spacing:.1em}
.lang button+button{border-left:0}
.lang button[aria-pressed="true"]{background:var(--glow);color:#fff;border-color:var(--glow)}

#hint{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  font-family:var(--f-pixel);font-size:19px;color:#aab3d6;pointer-events:none;background:linear-gradient(#05060c00,#05060cdd)}
.btn-ico{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#1b2347;color:#fff;font-size:14px;margin-right:6px;vertical-align:-2px;font-family:var(--f-body)}
.key{display:inline-block;border:1px solid #39426e;padding:0 6px;margin-right:6px;border-radius:2px;color:#fff}

/* hotspot labels over 3D objects */
#labels{position:fixed;inset:0;z-index:10;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;font-family:var(--f-display);font-size:10px;letter-spacing:.16em;
  padding:6px 9px;background:#070a18e6;border:1px solid var(--glow);color:#fff;white-space:nowrap;cursor:pointer;
  box-shadow:0 0 18px #4f7bff55;animation:bob 2.4s ease-in-out infinite}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:var(--glow);transform:translateX(-50%)}
.tag small{display:block;font-family:var(--f-pixel);font-size:15px;letter-spacing:0;color:var(--cyan);margin-top:2px}
.tag.amber{border-color:var(--amber);box-shadow:0 0 18px #ffb15c44}
.tag.amber::after{background:var(--amber)}
.tag.amber small{color:var(--amber)}
@keyframes bob{50%{transform:translate(-50%,calc(-100% - 5px))}}

#bubble{position:fixed;z-index:15;pointer-events:none;transform:translate(-100%,-100%);max-width:min(240px,60vw);background:#f4f7fb;color:#10162e;border:3px solid #10162e;padding:8px 12px 10px;font-family:var(--f-pixel);font-size:21px;line-height:1.05;box-shadow:4px 4px 0 #10162e;animation:pop .25s steps(3) both}
#bubble::after{content:"";position:absolute;right:-12px;bottom:10px;border:8px solid transparent;border-left:12px solid #10162e}
#bubble small{display:block;font-size:17px;color:#4a5578;margin-top:4px}
#bubble a{pointer-events:auto;display:inline-block;margin-top:8px;font-family:var(--f-display);font-size:9px;letter-spacing:.14em;padding:6px 8px;background:#e2384f;color:#fff;text-decoration:none}
@keyframes pop{from{transform:translate(-100%,-100%) scale(.6);opacity:0}}
#tooltip{position:fixed;z-index:30;pointer-events:none;font-family:var(--f-pixel);font-size:20px;color:#fff;background:#05060ce6;border:1px solid #39426e;padding:2px 8px;transform:translate(14px,14px)}

/* ---------- BOOT ---------- */
#boot{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center}
#bootCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.boot-card{position:relative;display:grid;gap:18px;justify-items:center;text-align:center;padding:24px max(16px,env(safe-area-inset-left,0px));transition:opacity .4s}
.boot-model{font-family:var(--f-pixel);font-size:20px;color:var(--dim);letter-spacing:.2em}
.boot-name{font-family:var(--f-display);font-size:clamp(26px,6vw,64px);line-height:1.05;letter-spacing:.06em;color:#fff;text-wrap:balance;text-shadow:0 0 30px #4f7bff88}
.boot-role{font-size:clamp(14px,2vw,18px);color:#b9c3ec;max-width:36ch}
.boot-start{margin-top:8px;font-family:var(--f-display);font-size:14px;letter-spacing:.3em;padding:16px 34px;background:transparent;border:1px solid var(--glow);color:#fff;
  box-shadow:0 0 0 1px #4f7bff33 inset,0 0 26px #4f7bff55;animation:pulse 1.6s ease-in-out infinite}
.boot-start:hover{background:#4f7bff22}
@keyframes pulse{50%{box-shadow:0 0 0 1px #4f7bff66 inset,0 0 42px #4f7bffaa}}
.boot-sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-family:var(--f-pixel);font-size:18px;color:var(--dim)}
.boot-sub button{background:none;border:0;border-bottom:1px solid currentColor;padding:0;font-family:var(--f-pixel);font-size:18px;color:var(--cyan)}
#bootSkip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:none;border:1px solid #333a5c;color:#9aa3c7;font-family:var(--f-display);font-size:10px;letter-spacing:.2em;padding:8px 12px}

/* ---------- TV (CRT overlay) ---------- */
#tv{position:fixed;z-index:25;container-type:size;overflow:hidden;border-radius:4% / 5%;
  background:radial-gradient(120% 100% at 50% 40%,#13204a 0%,#0a1130 45%,#050816 100%);
  box-shadow:inset 0 0 5cqw #000c,0 0 60px #4f7bff40;color:#dfe8ff;font-family:var(--f-body)}
#tv::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(#0000 0 2px,#00000038 2px 3px),radial-gradient(130% 110% at 50% 50%,#0000 60%,#000a 100%)}
#tv::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:#bcd3ff;opacity:0;mix-blend-mode:overlay;animation:flick 6s infinite}
@keyframes flick{0%,97%,100%{opacity:0}98%{opacity:.06}}
#tv.on .tv-inner{animation:crtOn .55s cubic-bezier(.2,.8,.3,1) both}
#tv.off .tv-inner{animation:crtOff .28s ease-in both}
@keyframes crtOn{0%{transform:scale(1,.006);filter:brightness(5)}35%{transform:scale(1,.006);filter:brightness(5)}70%{transform:scale(1,1);filter:brightness(1.5)}100%{transform:none;filter:none}}
@keyframes crtOff{0%{transform:none}60%{transform:scale(1,.006);filter:brightness(4)}100%{transform:scale(0,.006);filter:brightness(6)}}
.tv-inner{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:3.4cqh 3.6cqw 2.6cqh;gap:2.2cqh}
.tv-top{display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;padding-right:4cqw;border-bottom:1px solid #4f7bff55;padding-bottom:1.4cqh}
.tv-top b{font-family:var(--f-display);font-size:max(10px,1.7cqw);letter-spacing:.2em;color:var(--cyan);text-shadow:0 0 8px #8fe6ff99}
.tv-top span{font-family:var(--f-pixel);font-size:max(15px,2.6cqw);color:var(--dim)}
.tv-body{display:grid;grid-template-columns:34% minmax(0,1fr);gap:3cqw;min-height:0}
.tv-body>*{min-width:0}
.tv-list{min-height:0;overflow:auto;display:grid;align-content:start;gap:.8cqh;padding-right:1cqw;scrollbar-width:thin;scrollbar-color:#4f7bff66 transparent}
.yr{font-family:var(--f-pixel);font-size:max(15px,2.8cqw);color:var(--amber);margin-top:.8cqh;display:flex;align-items:center;gap:1cqw}
.yr::after{content:"";flex:1;height:1px;background:#ffb15c44}
.gi{display:grid;grid-template-columns:5.2cqw 1fr;gap:1.4cqw;align-items:center;text-align:left;padding:.7cqh .8cqw;background:transparent;border:1px solid transparent;border-radius:2px}
.gi img{width:100%;aspect-ratio:160/224;image-rendering:pixelated;display:block;box-shadow:0 0 0 1px #ffffff22}
.gi .gt{font-weight:600;font-size:max(12px,1.9cqw);line-height:1.15;min-width:0}
.gi .gs{display:block;font-family:var(--f-pixel);font-size:max(13px,2cqw);color:var(--dim);font-weight:400;margin-top:.2cqh}
.gi:hover{background:#4f7bff18}
.gi.sel{background:linear-gradient(90deg,#4f7bff44,#4f7bff10);border-color:#8fe6ff88;box-shadow:0 0 14px #4f7bff55}
.gi.sel .gt{color:#fff;text-shadow:0 0 8px #8fe6ffaa}
.gi.sel .gs{text-shadow:none;color:#a9bbef}
.tv-detail{min-height:0;min-width:0;display:grid;grid-template-columns:22cqw minmax(0,1fr);gap:3cqw;align-content:start;overflow:auto}
.tv-cover{position:relative}
.tv-cover img{width:100%;image-rendering:pixelated;display:block;box-shadow:0 0 0 1px #ffffff2a,0 1.4cqh 3cqh #000a;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-.8cqh) rotate(-.6deg)}}
.tv-info{min-width:0;display:grid;gap:1.6cqh;align-content:start}
.tv-title{font-family:var(--f-display);font-size:max(15px,3.1cqw);line-height:1.2;color:#fff;text-wrap:balance;margin:0;text-shadow:0 0 12px #4f7bff99}
.chips{display:flex;flex-wrap:wrap;gap:.8cqw}
.chips span{font-family:var(--f-pixel);font-size:max(13px,2cqw);line-height:1;padding:.6cqh .9cqw;border:1px solid #4f7bff66;color:#cfe0ff}
.chips span.st{border-color:var(--amber);color:var(--amber)}
.tv-desc{font-size:max(12px,1.85cqw);line-height:1.5;color:#c9d3f5;margin:0;max-width:62ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.4cqh 1.6cqw;font-size:max(11px,1.6cqw);color:#aab4dc}
.kv dt{font-family:var(--f-display);font-size:max(9px,1.2cqw);letter-spacing:.16em;color:var(--dim);padding-top:.3cqh}
.kv dd{margin:0}
.tv-actions{display:flex;gap:1.2cqw;flex-wrap:wrap}
.tvb{display:inline-flex;align-items:center;gap:.8cqw;font-family:var(--f-display);font-size:max(10px,1.45cqw);letter-spacing:.14em;padding:1.4cqh 2cqw;
  background:#4f7bff2a;border:1px solid #8fe6ff99;color:#fff;text-decoration:none;text-transform:uppercase}
.tvb:hover,.tvb:focus-visible{background:#4f7bff66;box-shadow:0 0 16px #4f7bff88}
.tvb.ghost{background:transparent;border-color:#4f7bff55;color:#b7c4ee}
.tvb[aria-disabled="true"]{opacity:.45;pointer-events:none}
.tv-foot{display:flex;gap:3cqw;justify-content:flex-end;font-family:var(--f-pixel);font-size:max(14px,2.2cqw);color:#9fb0e6;flex-wrap:wrap}
.tv-foot .btn-ico{width:max(16px,2.6cqw);height:max(16px,2.6cqw);font-size:max(11px,1.6cqw)}
.tv-close{position:absolute;right:2.4cqw;top:2.4cqh;z-index:7;background:none;border:0;font-family:var(--f-pixel);font-size:max(16px,2.4cqw);color:var(--dim)}
.tv-play{position:absolute;inset:3cqh 3cqw;z-index:4;display:grid;grid-template-rows:auto 1fr;gap:1cqh}
.tv-play iframe{width:100%;height:100%;border:0;background:#000}
/* phones: the TV fills the screen with a bezel */
#tv.full{inset:calc(56px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(52px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  left:max(10px,env(safe-area-inset-left,0px))!important;top:calc(56px + env(safe-area-inset-top,0px))!important;width:auto!important;height:auto!important;border-radius:22px;border:10px solid #15161b;box-shadow:0 0 0 1px #2b2d36,inset 0 0 40px #000c,0 0 40px #4f7bff44}
#tv.full .tv-inner{padding:14px 14px 10px;gap:10px}
#tv.full .tv-body{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:12px}
#tv.full .tv-list{display:flex;overflow-x:auto;overflow-y:hidden;gap:8px;padding:0 0 6px}
#tv.full .yr{display:none}
#tv.full .gi{flex:0 0 66px;grid-template-columns:1fr;padding:4px}
#tv.full .gi .gt,#tv.full .gi .gs{display:none}
#tv.full .tv-detail{display:block}
#tv.full .tv-cover{float:left;width:32%;margin:0 12px 8px 0}
#tv.full .tv-info{display:flex;flex-direction:column;gap:10px}
#tv.full .tv-title{order:0}#tv.full .chips{order:1}#tv.full .tv-actions{order:2}#tv.full .tv-desc{order:3;clear:both}#tv.full .kv{order:4}
#tv.full .tv-top{padding-right:28px}
#tv.full .tv-title{font-size:17px}
#tv.full .tv-desc{font-size:14px}
#tv.full .chips span{font-size:15px;padding:3px 6px}
#tv.full .kv{font-size:12.5px}#tv.full .kv dt{font-size:9px}
#tv.full .tvb{font-size:10px;padding:10px 12px}
#tv.full .tv-foot{display:none}


/* ---------- MANUAL ---------- */
#manual{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#03040acc;backdrop-filter:blur(3px);
  padding:calc(58px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(64px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#manual.open .book{animation:bookIn .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes bookIn{from{transform:translateY(30px) rotateX(18deg) scale(.94);opacity:0}}
.book{position:relative;width:var(--bw,820px);height:var(--bh,560px);perspective:2400px;filter:drop-shadow(0 30px 40px #000c)}
.page{position:absolute;top:0;width:50%;height:100%;container-type:size;background:var(--paper);color:var(--paper-ink);overflow:hidden}
.page.l{left:0;border-radius:6px 0 0 6px;background:linear-gradient(90deg,var(--paper) 88%,#d8d5cb)}
.page.r{left:50%;border-radius:0 6px 6px 0;background:linear-gradient(270deg,var(--paper) 88%,#d8d5cb)}
.book.single .page.r{left:0;width:100%;border-radius:6px;background:var(--paper)}
.book.single .page.l{display:none}
.page.empty{background:#20232e;box-shadow:inset 0 0 40px #0008}
.leaf{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;z-index:3;transition:transform .72s cubic-bezier(.45,.05,.25,1)}
.book.single .leaf{width:100%}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;container-type:size;background:var(--paper);color:var(--paper-ink);overflow:hidden}
.leaf .face.back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0000,#0000 70%,#0002);opacity:.0;transition:opacity .72s}
.book-nav{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:14px;font-family:var(--f-pixel);font-size:20px;color:#c5cbe3}
.book-nav button{background:#0b0f22;border:1px solid #39426e;padding:6px 14px;font-family:var(--f-display);font-size:10px;letter-spacing:.16em}
.book-nav button:hover{border-color:var(--amber);color:var(--amber)}
.book-nav button:disabled{opacity:.35;pointer-events:none}
.book-close{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:#0b0f22;border:1px solid #39426e;font-family:var(--f-display);font-size:10px;letter-spacing:.16em;padding:8px 12px}

/* page typography (inside the booklet) */
.pg{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:5cqh 7cqw 3.6cqh}
.pg-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:max(7px,1.55cqh);letter-spacing:.2em;border-bottom:2px solid var(--paper-ink);padding-bottom:1.2cqh;text-transform:uppercase}
.pg-foot{text-align:center;font-family:var(--f-pixel);font-size:max(13px,2.6cqh);color:#555a66}
.pg-body{min-height:0;padding-top:3cqh;display:grid;align-content:start;gap:2.2cqh}
.pg h2{font-family:var(--f-display);font-size:max(13px,3.4cqh);line-height:1.15;letter-spacing:.04em;margin:0;text-wrap:balance;text-transform:uppercase}
.pg h3{font-family:var(--f-display);font-size:max(9px,1.8cqh);letter-spacing:.16em;margin:0;text-transform:uppercase;color:#4a4f5c}
.pg p{margin:0;font-size:max(11px,2.35cqh);line-height:1.45}
.pg ul{margin:0;padding:0;list-style:none;display:grid;gap:1.5cqh}
.pg li{font-size:max(11px,2.3cqh);line-height:1.4}
.warn-box{border:2px solid var(--paper-ink);padding:2.4cqh 3cqw;display:grid;gap:1.8cqh}
.warn-title{display:flex;align-items:center;gap:2cqw;font-family:var(--f-display);font-size:max(10px,2.3cqh);letter-spacing:.12em}
.tri{width:0;height:0;border-left:1.9cqh solid transparent;border-right:1.9cqh solid transparent;border-bottom:3.3cqh solid var(--signal);position:relative;flex:none}
.tri::after{content:"!";position:absolute;left:50%;top:.6cqh;transform:translateX(-50%);color:#fff;font-weight:700;font-size:2.2cqh;line-height:1}
.warn-box li{padding-left:3.6cqw;position:relative}
.warn-box li::before{content:"■";position:absolute;left:0;color:var(--signal);font-size:1.6cqh;top:.4cqh}
.box-list li{display:grid;grid-template-columns:7cqw 1fr;align-items:baseline;border-bottom:1px dashed #b6b2a6;padding-bottom:1.1cqh}
.box-list b{font-family:var(--f-pixel);font-size:max(15px,3.2cqh);font-weight:400;color:var(--signal)}
.ctl{display:grid;gap:2cqh}.ctl svg{display:block;width:100%;height:auto;max-height:27cqh;color:var(--paper-ink)}
.ctl ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:1.4cqh 3cqw}
.ctl li{display:grid;grid-template-columns:4.2cqh 1fr;gap:1.4cqw;align-items:baseline;font-size:max(10px,2cqh);line-height:1.3}
.ctl li i{font-style:normal;display:grid;place-items:center;width:3.4cqh;height:3.4cqh;border-radius:50%;background:var(--paper-ink);color:var(--paper);font-family:var(--f-pixel);font-size:2.6cqh}
.ctl li b{font-family:var(--f-display);font-size:max(7.5px,1.35cqh);letter-spacing:.08em;display:block;margin-bottom:.3cqh;text-transform:uppercase}
.pg ul.timeline{gap:1.2cqh}.timeline li{font-size:max(10.5px,2.15cqh);display:grid;grid-template-columns:17cqw 1fr;gap:2cqw;align-items:baseline}

function ps1(mat){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uSnap = snapU;
    sh.vertexShader = 'uniform vec2 uSnap;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n vec4 sp = gl_Position; sp.xyz /= sp.w; sp.xy = floor(sp.xy * uSnap + 0.5) / uSnap; sp.xyz *= sp.w; gl_Position = sp;');
  };
  return mat;
}
function nearestTex(canvas, repX=1, repY=1){
  const tx = new THREE.CanvasTexture(canvas); tx.magFilter = THREE.NearestFilter; tx.minFilter = THREE.NearestFilter; tx.generateMipmaps = false;
  if (repX !== 1 || repY !== 1){ tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(repX, repY); }
  return tx;
}
const lam = (color, o={}) => ps1(new THREE.MeshLambertMaterial(Object.assign({ color }, o)));
function box(w,h,d,mat,x,y,z,parent){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); (parent||scene).add(m); return m; }
function canvasTex(w,h,fn,rx,ry){ const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const c=cv.getContext('2d'); c.imageSmoothingEnabled=false; fn(c,w,h); return nearestTex(cv,rx,ry); }

function initGL(){
  try {
    if (!window.THREE) throw new Error('three');
    renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias:false, powerPreference:'high-performance' });
  } catch(e){ return false; }
  renderer.setPixelRatio(1); renderer.localClippingEnabled = true;
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x05060c); scene.fog = new THREE.Fog(0x05060c, 5.5, 13);
  camera = new THREE.PerspectiveCamera(50, W/H, .05, 40);
  snapU.value = new THREE.Vector2(160, 120);
  rt = new THREE.WebGLRenderTarget(RW, RH, { minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter });
  postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1); postScene = new THREE.Scene();
  postMat = new THREE.ShaderMaterial({
    uniforms:{ tDiffuse:{ value: rt.texture }, uFade:{ value: 0 } },
    vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.,1.); }',
    fragmentShader:`uniform sampler2D tDiffuse; uniform float uFade; varying vec2 vUv;
      float b2(vec2 a){ a = floor(a); return fract(a.x/2. + a.y*a.y*.75); }
      float b4(vec2 a){ return b2(.5*a)*.25 + b2(a); }
      void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;
        c += (b4(gl_FragCoord.xy) - .5) / 24.;
        c = floor(c * 31. + .5) / 31.;
        c *= 1. - uFade;
        gl_FragColor = vec4(c, 1.); }`
  });
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat));
  buildRoom();
  return true;
}

function buildRoom(){

  const carpet = canvasTex(64,64,(c,w,h)=>{ const r=rng(7); px(c,0,0,w,h,'#262a3f'); for(let i=0;i<900;i++) px(c,r()*w,r()*h,1,1,r()<.5?'#1e2234':'#30354e'); for(let y=0;y<h;y+=16) px(c,0,y,w,1,'#1b1e2e'); }, 7, 9);
  const wallpaper = canvasTex(64,64,(c,w,h)=>{ px(c,0,0,w,h,'#1f2440'); for(let x=0;x<w;x+=16){ px(c,x,0,6,h,'#232948'); px(c,x+7,0,1,h,'#2c3358'); } const r=rng(3); for(let i=0;i<120;i++) px(c,r()*w,r()*h,1,1,'#1a1f38'); }, 6, 2);

  /* floor + walls */
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(7,10,28,40), lam(0xffffff,{ map:carpet })); floor.rotation.x = -Math.PI/2; floor.position.set(0,0,2); scene.add(floor);

  const rw = lw.clone(); rw.rotation.y = -Math.PI/2; rw.position.x = 3.5; scene.add(rw);
  box(7,.12,.04, lam(0x14172a), 0,.06,-2.98);

  /* window (back wall, right) with night sky + moon */
  const sky = canvasTex(96,72,(c,w,h)=>{ const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,'#0b1640'); g.addColorStop(1,'#2a3570'); c.fillStyle=g; c.fillRect(0,0,w,h); const r=rng(5); for(let i=0;i<50;i++) px(c,r()*w,r()*h*.7,1,1,'#cfd8ff'); c.fillStyle='#f4f1dc'; c.beginPath(); c.arc(70,20,9,0,7); c.fill(); c.fillStyle='#0b1640'; c.beginPath(); c.arc(66,17,8,0,7); c.fill(); px(c,0,58,w,14,'#0a0f26'); for(let x=0;x<w;x+=9) px(c,x,50+((x*7)%9),7,22,'#0d1330'); for(let i=0;i<14;i++) px(c,r()*w,54+r()*14,1,2,'#ffcf6b'); });

  const fr = lam(0x2b2f45); box(1.22,.06,.06,fr,2.35,2.19,-2.96); box(1.22,.06,.06,fr,2.35,1.31,-2.96); box(.06,.88,.06,fr,1.77,1.75,-2.96); box(.06,.88,.06,fr,2.93,1.75,-2.96); box(.04,.82,.04,fr,2.35,1.75,-2.96);

/* =====================================================================
   CAMERA + TWEENS
   ===================================================================== */
const V3 = (x,y,z) => new THREE.Vector3(x,y,z);
const cam = { pos:null, look:null };
const tweens = [];
const ease = k => k<.5 ? 4*k*k*k : 1 - Math.pow(-2*k+2,3)/2;
function tween(dur, update, done){ if (reduced || dur <= 0){ update(1); done && done(); return; } tweens.push({ t0: performance.now(), dur: dur*1000, update, done }); }
function runTweens(now){ for (let i=tweens.length-1;i>=0;i--){ const tw = tweens[i], k = Math.min(1,(now-tw.t0)/tw.dur); tw.update(ease(k)); if (k>=1){ tweens.splice(i,1); tw.done && tw.done(); } } }
function roomPose(){
  const target = V3(0,.92,-2.3), v = camera.fov*Math.PI/360, hf = Math.atan(Math.tan(v)*camera.aspect);
  let d = Math.max(1.55/Math.tan(hf), 1.35/Math.tan(v)); d = Math.min(Math.max(d,3.4),9);
  const dir = V3(0,.24,1).normalize();
  return { pos: target.clone().add(dir.multiplyScalar(d)), look: target };
}
function tvPose(){
  const v = camera.fov*Math.PI/360, hf = Math.atan(Math.tan(v)*camera.aspect);
  const d = Math.max((SCREEN_W/2)/(Math.tan(hf)*.84), (SCREEN_H/2)/(Math.tan(v)*.78));
  const c = V3(SCREEN_C.x, SCREEN_C.y, SCREEN_C.z);
  return { pos: c.clone().add(V3(0,0,d)), look: c };
}
function moveCam(pose, dur, done){
  const p0 = cam.pos.clone(), l0 = cam.look.clone();
  tween(dur, k=>{ cam.pos.lerpVectors(p0, pose.pos, k); cam.look.lerpVectors(l0, pose.look, k); }, done);
}

function placeTv(){
  const el = $('#tv'); if (el.hidden) return;
  const full = W < 760 || H < 480 || W/H < 1.05;
  el.classList.toggle('full', full);
  if (full) return;
  // fit the overlay to the projected 3D screen rectangle
  const pts = [[-1,-1],[1,-1],[1,1],[-1,1]].map(([sx,sy]) => V3(SCREEN_C.x + sx*SCREEN_W/2*.97, SCREEN_C.y + sy*SCREEN_H/2*.96, SCREEN_C.z).project(camera));
  const xs = pts.map(p=>(p.x+1)/2*W), ys = pts.map(p=>(1-p.y)/2*H);
  const l = Math.min(...xs), r = Math.max(...xs), tp = Math.min(...ys), b = Math.max(...ys);
  Object.assign(el.style, { left:l+'px', top:tp+'px', width:(r-l)+'px', height:(b-tp)+'px' });
}
function openTv(gameId){
  if (mode === 'tv' || mode === 'boot') return;
  if (gameId){ sel = GAMES.findIndex(g=>g.id===gameId); }

  $('#tv').hidden = true;
  moveCam(tvPose(), .9, () => {
    if (mode !== 'tv') return;

    setTimeout(()=>{ const f = el.querySelector('.gi.sel') || el.querySelector('button'); f && f.focus({ preventScroll:true }); }, 60);
  });
}
function closeTv(){

function renderBook(){

    $('#pgNum').textContent = `${spread+1} / ${maxS+1}`;

function flip(dir){
  if (flipping) return; const n = pageCache.length, single = isSingle(), book = $('#book');
  const max = single ? n-1 : Math.ceil((n-1)/2); const next = spread + dir;
  if (next < 0 || next > max) return;
  sfx.page();
  if (reduced){ spread = next; renderBook(); return; }
  flipping = true;
  const leaf = document.createElement('div'); leaf.className = 'leaf';
  const front = document.createElement('div'), back = document.createElement('div'); front.className = 'face'; back.className = 'face back';
  leaf.append(front, back);
  const pL = $('#pgL'), pR = $('#pgR');
  if (single){
    leaf.style.left = '0'; leaf.style.transformOrigin = 'left center';
    if (dir > 0){ front.innerHTML = pageCache[spread]; setPage(pR, pageCache[next]); leaf.style.transform = 'rotateY(0deg)'; }
    else { front.innerHTML = pageCache[next]; leaf.style.transform = 'rotateY(-180deg)'; }
    back.style.background = '#d9d6cc';
    book.appendChild(leaf); void leaf.offsetWidth;
    leaf.style.transform = dir > 0 ? 'rotateY(-180deg)' : 'rotateY(0deg)';
  } else {
    const cur = spread, li = i => i*2-1, ri = i => i*2;
    if (dir > 0){
      leaf.style.left = '50%'; leaf.style.transformOrigin = 'left center';
      front.innerHTML = pageCache[ri(cur)] ?? ''; back.innerHTML = pageCache[li(next)] ?? '';
      setPage(pR, ri(next) < n ? pageCache[ri(next)] : null);
      book.appendChild(leaf); void leaf.offsetWidth; leaf.style.transform = 'rotateY(-180deg)';
    } else {
      leaf.style.left = '0'; leaf.style.transformOrigin = 'right center';
      front.innerHTML = li(cur) >= 0 ? pageCache[li(cur)] : ''; back.innerHTML = pageCache[ri(next)] ?? '';
      setPage(pL, li(next) >= 0 ? pageCache[li(next)] : null);
      book.appendChild(leaf); void leaf.offsetWidth; leaf.style.transform = 'rotateY(180deg)';
    }
  }
  leaf.addEventListener('transitionend', () => { spread = next; flipping = false; renderBook(); }, { once:true });
}

   ===================================================================== */
const bc = $('#bootCanvas'), bx = bc.getContext('2d');
let bootT0 = 0, bootRunning = false;

  const sorted = bootPillars.slice().sort((a,b)=>b.gz-a.gz);
  for (const p of sorted){
    const z = p.gz*1.25 + 2.6 - camZ; if (z < .5) continue;
    const k = Math.max(0, Math.min(1, (rise*1.6 - p.d)));
    const hh = p.h * k * (1 + .08*Math.sin(now/600 + p.gx)); if (hh < .01) continue;
    const x = p.gx*.75, [x1,yb] = proj(x-.14,-.6,z), [x2] = proj(x+.14,-.6,z), [,yt] = proj(x,-.6+hh,z);
    const a = Math.min(1, 2.2/z);
    const g = bx.createLinearGradient(0,yt,0,yb); g.addColorStop(0,`hsla(${p.hue},100%,80%,${.75*a})`); g.addColorStop(1,`hsla(${p.hue},100%,45%,${.08*a})`);
    bx.fillStyle = g; bx.fillRect(x1, yt, x2-x1, yb-yt);
    bx.fillStyle = `hsla(${p.hue},100%,92%,${a})`; bx.fillRect(x1, yt, x2-x1, 1);
  }
  // floating motes
  for (let i=0;i<40;i++){ const x = (i*97 + now*.01*(1+i%3)) % w, y = h - ((i*53 + now*.02*(1+i%4)) % h); bx.fillStyle = `rgba(160,200,255,${.15+(i%5)/10})`; bx.fillRect(x|0, y|0, 1, 1); }
  if (bootRunning){
    // logo
    const la = Math.min(1, Math.max(0,(ts-2.1)/.6)) * (1 - Math.min(1, Math.max(0,(ts-4.3)/.5)));
    if (la > 0){
      bx.textAlign = 'center'; bx.fillStyle = `rgba(255,255,255,${la})`; bx.font = `${Math.round(h*.075)}px Michroma, sans-serif`; bx.fillText('PLURSUS', cx, h*.36);
      bx.fillStyle = `rgba(143,230,255,${la*.9})`; bx.font = `${Math.round(h*.06)}px VT323, monospace`; bx.fillText('BORA MERT KALKAN', cx, h*.36 + h*.07);
    }
    // CRT power-on dot at the start, white flash at the end
    if (ts < .45){ const k = ts/.45; bx.fillStyle = '#000'; bx.fillRect(0,0,w,h); bx.fillStyle = '#fff'; bx.fillRect(cx - w*k/2, cy - 1, w*k, 2); }
    const fo = Math.min(1, Math.max(0,(ts-4.6)/.6)); if (fo > 0){ bx.fillStyle = `rgba(6,8,20,${fo})`; bx.fillRect(0,0,w,h); }
    if (ts > 5.2) finishBoot();
  }
}
function startBoot(){
  if (bootRunning) return;
  audioInit(); if (actx && actx.state === 'suspended') actx.resume();
  bootRunning = true; bootT0 = performance.now(); $('#bootCard').style.opacity = 0; $('#bootCard').style.pointerEvents='none'; $('#bootSkip').hidden = false;
  sfx.boot();
  if (reduced) finishBoot();
}
function finishBoot(){
  if (mode !== 'boot') return;
  bootRunning = false; $('#boot').hidden = true; $('#hud').hidden = false; $('#hint').hidden = false;
  mode = 'room'; setHint();
  // zoom out of the TV into the room
  const tp = tvPose(); cam.pos = tp.pos.clone(); cam.look = tp.look.clone();
  postMat.uniforms.uFade.value = 1; tween(.6, k=> postMat.uniforms.uFade.value = 1-k);
  moveCam(roomPose(), 1.8);
  sfx.crt();
}

/* =====================================================================
   EASTER EGG — Plursus says hi through the window
   ===================================================================== */
function bubble(main, sub, link){
  const b = $('#bubble'); b.innerHTML = `${esc(main)}<small>${esc(sub)}</small>` + (link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(t('helloLink'))}</a>` : '');
  b.hidden = false; b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
}
function plursusHello(){
  if (egg || mode !== 'room') return;
  audioInit(); sfx.hello(); egg = { phase:'up', t0: performance.now() };
  const f0 = fishGroup.position.y;
  tween(.35, k => { fishMesh.position.y = -.32 + Math.sin(k*Math.PI)*.08; });
  bearWave.visible = true; bearLaugh.visible = false;
  tween(.55, k => { bearWave.position.y = BEAR_DOWN + (BEAR_UP-BEAR_DOWN)*k; }, () => {
    bubble(t('hello1'), t('hello1s'));
    setTimeout(() => { if (!egg) return; egg.phase = 'laugh'; bearLaugh.position.y = BEAR_UP; bearWave.visible = false; bearLaugh.visible = true; sfx.ok();
      bubble(t('hello2'), t('hello2s'), CONFIG.youtube || null); }, 1800);
    setTimeout(() => { if (!egg) return; $('#bubble').hidden = true; const m = bearLaugh.visible ? bearLaugh : bearWave;
      tween(.5, k => { m.position.y = BEAR_UP - (BEAR_UP-BEAR_DOWN)*k; }, () => { bearWave.visible = bearLaugh.visible = false; bearWave.position.y = bearLaugh.position.y = BEAR_DOWN; egg = null; }); }, 5600);
  });
}
function placeBubble(){
  const b = $('#bubble'); if (b.hidden) return;
  if (mode !== 'room'){ b.hidden = true; return; }
  const p = V3(1.86, 1.86, -2.97).project(camera);
  b.style.left = ((p.x+1)/2*W) + 'px'; b.style.top = ((1-p.y)/2*H) + 'px';
}

/* =====================================================================
   INPUT
   ===================================================================== */
let raycaster;
function pick(){
  if (!mouse.has || mode !== 'room') return null;
  raycaster.setFromCamera({ x: mouse.nx, y: mouse.ny }, camera);
  const hit = raycaster.intersectObjects(interactive, false)[0];
  return hit ? hit.object : null;
}
function showTooltip(text){ const tt = $('#tooltip'); tt.textContent = text; tt.hidden = false; tt.style.left = mouse.x+'px'; tt.style.top = mouse.y+'px'; }
function hideTooltip(){ $('#tooltip').hidden = true; }
function activate(obj){
  const k = obj.userData.kind;
  if (k === 'case') pickCase(obj);
  else if (k === 'manual') openManual();
  else if (k === 'fish') plursusHello();
  else if (k === 'bear'){ if (CONFIG.youtube){ const a = document.createElement('a'); a.href = CONFIG.youtube; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); } }
  else { audioInit(); sfx.ok(); openTv(); }
}
function onPointerMove(e){
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.nx = e.clientX/W*2-1; mouse.ny = -(e.clientY/H*2-1); mouse.has = true;
}
function onCanvasClick(e){
  onPointerMove(e); const o = pick(); if (o){ audioInit(); activate(o); }
}

const keyMap = { ArrowUp:'up', w:'up', ArrowDown:'down', s:'down', ArrowLeft:'left', a:'left', ArrowRight:'right', d:'right', Enter:'ok', ' ':'ok', Escape:'back', Backspace:'back', m:'manual', M:'manual', l:'lang', L:'lang' };
function command(c){
  if (mode === 'boot'){ if (c==='ok') startBoot(); if (c==='back' && bootRunning) finishBoot(); return; }
  if (c === 'lang'){ setLang(lang==='tr'?'en':'tr'); return; }
  if (mode === 'room'){
    if (c==='ok'){ sfx.ok(); openTv(); }
    else if (c==='manual') openManual();
    else if (c==='left' || c==='right'){ // walk the shelf highlight with keys / gamepad
      shelfFocus = (shelfFocus == null ? GAMES.length-1 : shelfFocus + (c==='left'?-1:1)); shelfFocus = Math.max(0, Math.min(GAMES.length-1, shelfFocus)); sfx.move();
    } else if (c==='up' && shelfFocus != null){ pickCase(caseMeshes[shelfFocus]); }
    return;
  }
  if (mode === 'tv'){
    if (c==='up'||c==='left') tvStep(-1); else if (c==='down'||c==='right') tvStep(1);
    else if (c==='ok') tvConfirm(); else if (c==='back'){ if (playing){ playing=false; sfx.back(); renderTv(); } else closeTv(); }
    else if (c==='manual') openManual();
    return;
  }
  if (mode === 'manual'){ if (c==='right'||c==='down') flip(1); else if (c==='left'||c==='up') flip(-1); else if (c==='back'||c==='manual') closeManual(); return; }
  if (mode === 'quick'){ if (c==='back') closeQuick(); }
}
let shelfFocus = null;
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('iframe')) return;
  const c = keyMap[e.key]; if (!c) return;
  // let real buttons/links handle Enter/Space themselves
  if ((c==='ok') && (e.target.tagName==='BUTTON' || e.target.tagName==='A') && mode !== 'tv') return;
  if (c==='ok' && mode==='tv' && (e.target.tagName==='A' || (e.target.tagName==='BUTTON' && !e.target.classList.contains('gi')))) return;
  if (mode==='quick' && c!=='back') return;
  e.preventDefault(); audioInit(); command(c);
});

/* gamepad: d-pad / left stick, A = ok, B = back, Start = TV, Select = manual */
const padPrev = {};
function pollPad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : []; const p = pads && [...pads].find(Boolean); if (!p) return;
  const ax = p.axes[0]||0, ay = p.axes[1]||0, b = i => !!(p.buttons[i] && p.buttons[i].pressed);
  const st = { up: b(12) || ay < -.6, down: b(13) || ay > .6, left: b(14) || ax < -.6, right: b(15) || ax > .6, ok: b(0), back: b(1), start: b(9), select: b(8) };
  for (const k in st){
    if (st[k] && !padPrev[k]){
      if (k==='start'){ if (mode==='boot') startBoot(); else if (mode==='room') openTv(); }
      else if (k==='select'){ if (mode==='manual') closeManual(); else openManual(); }
      else command(k);
    }
    padPrev[k] = st[k];
  }
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let glOK = false;
function resize(){
  W = innerWidth; H = innerHeight; bootSize();
  if (!glOK) return;
  const s = 256/Math.min(W,H); RW = Math.max(64, Math.round(W*s)); RH = Math.max(64, Math.round(H*s));
  renderer.setSize(RW, RH, false); rt.setSize(RW, RH);
  snapU.value.set(RW/2.4, RH/2.4);
  camera.aspect = W/H; camera.updateProjectionMatrix();
  if (mode==='room' && !tweens.length){ const p = roomPose(); cam.pos.copy(p.pos); cam.look.copy(p.look); }
  if (mode==='tv' && !tweens.length){ const p = tvPose(); cam.pos.copy(p.pos); cam.look.copy(p.look); }
  placeTv();
  if (mode==='manual') renderBook();
}
function frame(now){
  requestAnimationFrame(frame);
  pollPad();
  if (mode === 'boot'){ drawBoot(now); }
  if (!glOK) return;
  runTweens(now);
  // idle sway + parallax in the room
  const sway = mode==='room' ? 1 : mode==='tv' ? .15 : .4;
  const off = V3((mouse.has ? mouse.nx*.12 : 0) + Math.sin(now/2300)*.03, (mouse.has ? mouse.ny*.06 : 0) + Math.sin(now/1700)*.015, 0).multiplyScalar(reduced ? 0 : sway);
  camera.position.copy(cam.pos).add(off); camera.lookAt(cam.look);
  // hover
  const o = pick();
  if (o !== hovered){
    hovered = o; document.body.style.cursor = o ? 'pointer' : '';
    if (o && o.userData.kind==='case') sfx.move();
  }
  if (hovered && mode==='room'){
    const k = hovered.userData.kind; const g = k==='case' ? GAMES.find(x=>x.id===hovered.userData.id) : null;
    showTooltip(g ? `${g.title} · ${g.year}` : t('tooltip')[k] || '');
  } else hideTooltip();
  caseMeshes.forEach((m,i)=>{
    if (mode==='busy' && m.scale.x < 1) return;
    const target = (hovered===m || shelfFocus===i) && mode==='room' ? 1 : 0;
    m.userData.hover += (target - m.userData.hover)*.2;
    const hv = m.userData.hover; m.position.z = m.userData.base.z + hv*.09; m.position.y = m.userData.base.y + hv*.03; m.rotation.x = m.userData.baseRot + hv*.12;
    m.userData.front.emissive.setRGB(hv*.25, hv*.25, hv*.3);
  });
  const mo = anchors.manualObj; if (mo){ const hv = hovered===mo ? 1 : 0; mo.material[2].emissive.setRGB(hv*.2,hv*.16,hv*.08); }
  // lights breathe
  tvLight.intensity = 1.05 + Math.sin(now/90)*.05 + (Math.random()<.02?.25:0);
  lampLight.intensity = 1.45 + Math.sin(now/1300)*.04;
  if (fishGroup){ const hv = hovered === fishMesh; fishGroup.rotation.z = Math.sin(now/(hv?180:900))*(hv?.18:.07); }
  if (bearLaugh && bearLaugh.visible){ bearLaugh.material.map.offset.x = (Math.floor(now/120) % 9)/9; }
  drawScreen(now);
  placeTags(); placeTv(); placeBubble();
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

/* =====================================================================
   WIRE-UP
   ===================================================================== */
async function boot(){
  bootSize();
  try { await Promise.race([ Promise.all(['16px VT323','bold 15px "Chakra Petch"','10px Michroma'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,1500)) ]); } catch(e){}
  GAMES.forEach(g => { coverCanvases[g.id] = drawCover(g); coverURLs[g.id] = coverCanvases[g.id].toDataURL(); });
  if (CONFIG.cvPdf){ const cvb = $('#cvBtn'); cvb.href = CONFIG.cvPdf; cvb.hidden = false; }
  glOK = initGL();
  if (glOK){
    raycaster = new THREE.Raycaster();
    const p = roomPose(); cam.pos = p.pos.clone(); cam.look = p.look.clone();
    $('#gl').addEventListener('pointermove', onPointerMove);
    $('#gl').addEventListener('click', onCanvasClick);
    $('#gl').addEventListener('pointerleave', ()=>{ mouse.has = false; });
  }
  applyLang();
  resize();
  if (!glOK){ $('#boot').hidden = true; $('#hud').hidden = false; $('#nogl').textContent = t('nogl'); $('#nogl').hidden = false; mode = 'quick'; $('#quick').hidden = false; $('#quickClose').hidden = true; }
  requestAnimationFrame(frame);
}
$('#bootStart').onclick = startBoot;
$('#bootSkip').onclick = finishBoot;
$('#bootQuick').onclick = () => { audioInit(); openQuick(); };
$('#bootLang').onclick = () => setLang(lang==='tr'?'en':'tr');
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
$('#sndBtn').onclick = () => { audioInit(); soundOn = !soundOn; try{ localStorage.setItem('bmk-snd', soundOn?'1':'0'); }catch(e){} if (master) master.gain.value = soundOn ? .5 : 0; applyLang(); sfx.ok(); };
$('#manualBtn').onclick = () => { audioInit(); mode==='manual' ? closeManual() : openManual(); };
$('#quickBtn').onclick = () => { audioInit(); openQuick(); };
$('#quickClose').onclick = closeQuick;
$('#bookClose').onclick = closeManual;
$('#pgPrev').onclick = () => flip(-1);
$('#pgNext').onclick = () => flip(1);
$('#manual').addEventListener('click', e => { if (e.target.id === 'manual') closeManual(); });
// swipe to turn pages
let sx = null; $('#book').addEventListener('pointerdown', e => sx = e.clientX); $('#book').addEventListener('pointerup', e => { if (sx==null || e.target.closest('a')) { sx = null; return; } const d = e.clientX - sx; if (Math.abs(d) > 40) flip(d < 0 ? 1 : -1); else if (e.target.closest('.page.r')) flip(1); else if (e.target.closest('.page.l')) flip(-1); sx = null; });
addEventListener('resize', resize);
boot();
})();
</script>
